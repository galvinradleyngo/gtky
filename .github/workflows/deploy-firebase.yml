name: Deploy to Cloud Run + Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: npm ci && npm test

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: gtky
          region: us-central1
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          source: .
          env_vars: FIRESTORE_ENABLED=1
          flags: --allow-unauthenticated

      - name: Deploy Firebase Hosting + Firestore rules
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting,firestore:rules --project "${{ secrets.GCP_PROJECT_ID }}" --non-interactive
